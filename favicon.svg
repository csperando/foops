<svg id="egg-svg" viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
    <!-- Soft Egg White Base Shadow -->
    <ellipse cx="32" cy="40" rx="26" ry="16" fill="#0F172A" opacity="0.08"/>
    
    <!-- Organic Egg White Shape -->
    <path d="M32 10 &#10;                                     C48 10, 58 24, 56 38 &#10;                                     C54 50, 42 56, 30 54 &#10;                                     C16 52, 8 44, 10 32 &#10;                                     C12 20, 20 10, 32 10 Z" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    
    <!-- Glossy highlight on white -->
    <path d="M22 20 C28 15, 42 16, 48 24 C44 20, 32 18, 22 20 Z" fill="#F8FAFC" opacity="0.9"/>

    <!-- Vibrant Yellow Yolk with Drop Shadow Effect -->
    <circle cx="33" cy="33" r="14.5" fill="#D97706" opacity="0.15"/>
    <circle cx="33" cy="32" r="13.5" fill="url(#yolkGradient)"/>

    <!-- Yolk Specular Highlights -->
    <ellipse cx="29" cy="27" rx="3.5" ry="2" transform="rotate(-30 29 27)" fill="#FEF3C7"/>
    <circle cx="26" cy="31" r="1.2" fill="#FEF3C7" opacity="0.7"/>

    <!-- Cute Happy Face Details -->
    <g class="face">
        <!-- Left Eye -->
        <circle cx="28.5" cy="31" r="1.5" fill="#78350F"/>
        <!-- Right Eye -->
        <circle cx="37.5" cy="31" r="1.5" fill="#78350F"/>
        <!-- Smile -->
        <path d="M31.5 35 Q33 37.5 34.5 35" fill="none" stroke="#78350F" stroke-width="1.3" stroke-linecap="round"/>
        <!-- Rosy Cheeks -->
        <circle cx="26.5" cy="33" r="1.8" fill="#F43F5E" opacity="0.3"/>
        <circle cx="39.5" cy="33" r="1.8" fill="#F43F5E" opacity="0.3"/>
    </g>

    <!-- Gradient Definition -->
    <defs>
        <radialGradient id="yolkGradient" cx="35%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#FBBF24"/>
            <stop offset="60%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#D97706"/>
        </radialGradient>
    </defs>
</svg>
