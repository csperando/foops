<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Foops</title>
        <link rel="stylesheet" href="css/tokens.css">
        <link rel="stylesheet" href="css/app.css">
    </head>
    <body>

    <header>
    <h1>Demo</h1>
    <p>
        Todo
    </p>
    </header>

    <div class="hero">
        <div>
            <div class="hero-label">Overall verdict</div>
            <div class="hero-verdict unknown" id="hero-verdict">Checking&hellip;</div>
            <div class="hero-sub" id="hero-sub">Based on the strongest signal available in this browser.</div>
        </div>
        <div class="hero-count" id="hero-count">
            <!--
                &mdash;
                <small>screens (if known)</small>
            -->
        </div>
    </div>

    <main>

    <section class="card">
        <div class="card-head">
        <h2 class="card-title">Library output &mdash; <code>foops.monitor</code></h2>
        <span class="badge unknown" id="badge-lib">watching</span>
        </div>
        <p class="card-desc">
        The latest summary from <code>foops.monitor.watch()</code>. Checking screen details asks
        for the window-management permission, so it only runs when you click.
        </p>
        <button id="btn-details">Check screen details&hellip;</button>
        <pre id="out-lib"></pre>
    </section>

    </main>

    <script type="module">
        import { monitor } from "./scripts/lib/index.js";

        const $ = (id) => document.getElementById(id);
        const HERO = {
            multiple: { text: "Multiple displays detected", state: "yes" },
            single: { text: "Single display", state: "no" },
            unknown: { text: "Unknown", state: "unknown" }
        };
        const output = { watch: null, screenDetails: null };

        function render() {
            $("out-lib").textContent = JSON.stringify(output, null, 2);
        }

        function renderVerdict({ verdict }) {
            const hero = HERO[verdict];
            $("hero-verdict").textContent = hero.text;
            $("hero-verdict").className = "hero-verdict " + hero.state;
            $("hero-sub").textContent = "Source: foops.monitor.watch()";
            $("badge-lib").className = "badge " + hero.state;
            $("badge-lib").textContent = verdict;
            output.watch = { verdict };
            render();
        }

        monitor.watch(renderVerdict);

        $("btn-details").addEventListener("click", async () => {
            $("btn-details").disabled = true;
            output.screenDetails = await monitor.screenDetails();
            render();
            $("btn-details").disabled = false;
        });
    </script>

    </body>
</html>
