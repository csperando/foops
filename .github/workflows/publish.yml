# Publishes to npm when a version tag (v1.2.3) is pushed, using npm trusted
# publishing (OIDC): no stored token. Requires the foops package on npm to
# list this repository and workflow as a trusted publisher.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      # A tag for a version that was published by hand (e.g. v0.1.0) passes
      # without trying to publish it again.
      - name: Skip versions already on npm
        id: published
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm test
        if: steps.published.outputs.skip != 'true'
      - run: npm run build
        if: steps.published.outputs.skip != 'true'
      - run: npm publish --access public
        if: steps.published.outputs.skip != 'true'
